<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe5">
<title>Sudoku Garden</title>
<style>
:root{
  --bg:#f4efe5;--paper:#fffdf8;--paper-2:#f8f3ea;--ink:#403b49;--muted:#817b88;
  --line:#d9d1c4;--line-strong:#a49b8f;--emerald:#4d9b87;--emerald-dark:#367b6a;
  --emerald-soft:#dcefe8;--purple:#80699f;--purple-dark:#604c7c;--purple-soft:#ebe5f3;
  --orange:#d99558;--orange-soft:#f7e5d1;--danger:#c87572;--danger-soft:#f5dddd;
  --shadow:0 10px 30px rgba(75,65,55,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 20% 10%,rgba(128,105,159,.07),transparent 30%),radial-gradient(circle at 90% 70%,rgba(77,155,135,.08),transparent 32%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;padding:max(14px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,select{font:inherit}
.app{width:100%;max-width:560px;margin:0 auto}
.header{text-align:center;padding:8px 4px 16px}
.title{margin:0;font-size:clamp(26px,7vw,36px);letter-spacing:.04em;font-weight:800;color:var(--purple-dark)}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:13px;letter-spacing:.08em}
.message{min-height:42px;margin:0 4px 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.55;color:var(--muted);padding:9px 12px;border-radius:16px;background:rgba(255,253,248,.78)}
.message.error{color:var(--danger);background:var(--danger-soft)}
.message.success{color:var(--emerald-dark);background:var(--emerald-soft)}
.game-card{background:rgba(255,253,248,.92);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:14px;box-shadow:var(--shadow)}
.board-wrap{width:100%;display:flex;justify-content:center}
.board{width:min(100%,520px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,1fr);background:var(--line);border:5px solid var(--line-strong);border-radius:27px;overflow:hidden;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border:1px solid var(--line);background:#fbf8f1;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:clamp(17px,7vw,30px);line-height:1;font-weight:700;transition:background .12s ease,color .12s ease,opacity .12s ease}
.cell:nth-child(3n){border-right:2px solid var(--line-strong)}.cell:nth-child(9n){border-right:none}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line-strong)}
.cell.given{color:var(--purple-dark);background:#fbf8f1;font-weight:800}
.cell.user-number{color:var(--emerald-dark);font-weight:750}
.cell.selected{background:var(--emerald-soft)}
.cell.same-number{background:var(--purple-soft)}
.cell.related{background:#eef5f1}
.cell.selected.same-number{background:var(--emerald-soft)}
.cell.hint-error{color:var(--danger)!important;background:var(--danger-soft)!important}
.cell.complete{opacity:.48;background:#f0ede6}
.notes{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
.note{display:flex;align-items:center;justify-content:center;font-size:clamp(7px,2.1vw,11px);line-height:1;color:var(--purple);font-weight:700}
.legend{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px 17px;padding:14px 4px 6px;color:var(--muted);font-size:12px}
.legend-item{display:flex;align-items:center;gap:6px}.dot{width:11px;height:11px;border-radius:50%}.dot.given{background:var(--purple)}.dot.user{background:var(--emerald)}.dot.check{background:var(--orange)}
.number-pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}
.num{min-width:0;aspect-ratio:1/1;border:none;border-radius:13px;background:var(--paper-2);color:var(--purple-dark);font-weight:800;font-size:clamp(16px,5vw,22px);box-shadow:inset 0 0 0 1px rgba(128,105,159,.12);cursor:pointer;transition:transform .08s ease,background .12s ease,opacity .12s ease}
.num:active{transform:scale(.94)}.num.active{background:var(--emerald-soft);color:var(--emerald-dark)}.num.used{opacity:.35;background:#eeeae2}
.memo-row{display:flex;justify-content:center;margin-top:10px}
.memo-btn{border:none;padding:9px 17px;border-radius:999px;color:var(--purple-dark);background:var(--purple-soft);font-size:13px;font-weight:700;cursor:pointer}
.memo-btn.active{color:white;background:var(--purple)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.action-btn{min-height:48px;border:none;border-radius:15px;background:var(--paper-2);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(64,59,73,.08)}
.action-btn:active{transform:scale(.98)}.action-btn.primary{color:white;background:var(--emerald)}.action-btn.check{color:white;background:var(--orange)}.action-btn.danger{color:var(--danger)}.action-btn:disabled{opacity:.4}
.settings{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:15px;color:var(--muted);font-size:13px}
select{border:none;outline:none;padding:8px 28px 8px 12px;border-radius:12px;background:var(--paper-2);color:var(--purple-dark);font-weight:700}
@media(max-width:360px){.game-card{padding:9px;border-radius:24px}.board{border-width:4px;border-radius:22px}.cell{font-size:clamp(16px,7vw,24px)}.number-pad{gap:4px}.num{border-radius:10px;font-size:16px}.actions{gap:7px}.action-btn{min-height:44px;font-size:13px}}
@media(max-width:320px){.legend{font-size:10px;gap:6px 10px}.cell{font-size:16px}.note{font-size:7px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><h1 class="title">Sudoku Garden</h1><p class="subtitle">ゆっくり、ひとマスずつ。</p></header>
<div id="message" class="message">マスを選んで数字を入力してください。</div>
<main class="game-card">
<div class="board-wrap"><div id="board" class="board"></div></div>
<div class="legend">
<div class="legend-item"><span class="dot given"></span><span>最初からある数字</span></div>
<div class="legend-item"><span class="dot user"></span><span>自分で入力した数字</span></div>
<div class="legend-item"><span class="dot check"></span><span>確認</span></div>
</div>
<div id="numberPad" class="number-pad"></div>
<div class="memo-row"><button id="memoBtn" class="memo-btn">メモ：OFF</button></div>
<div class="actions">
<button id="checkBtn" class="action-btn check">間違いを確認</button>
<button id="eraseBtn" class="action-btn danger">消去</button>
<button id="undoBtn" class="action-btn">↶ 元に戻す</button>
<button id="redoBtn" class="action-btn">↷ やり直す</button>
<button id="newGameBtn" class="action-btn primary">新しい問題</button>
</div>
<div class="settings"><span>難易度</span><select id="difficulty"><option value="easy">かんたん</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option></select></div>
</main>
</div>
<script>
"use strict";

const boardEl=document.getElementById("board");
const numberPadEl=document.getElementById("numberPad");
const memoBtn=document.getElementById("memoBtn");
const checkBtn=document.getElementById("checkBtn");
const eraseBtn=document.getElementById("eraseBtn");
const undoBtn=document.getElementById("undoBtn");
const redoBtn=document.getElementById("redoBtn");
const newGameBtn=document.getElementById("newGameBtn");
const difficultyEl=document.getElementById("difficulty");
const messageEl=document.getElementById("message");

let puzzle=[],solution=[],grid=[],notes=[],selected=-1,noteMode=false,history=[],future=[];

const difficultySettings={easy:{remove:40},normal:{remove:49},hard:{remove:56}};

function shuffle(array){const arr=[...array];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function deepCopyGrid(g){return g.map(row=>[...row])}
function createEmptyNotes(){return Array.from({length:81},()=>new Set())}
function rowOf(index){return Math.floor(index/9)}
function colOf(index){return index%9}
function indexOf(row,col){return row*9+col}

function makeSolution(){
  const base=3;
  function pattern(r,c){return(base*(r%base)+Math.floor(r/base)+c)%9}
  const nums=shuffle([1,2,3,4,5,6,7,8,9]);
  const rowGroups=shuffle([0,1,2]),rows=[];
  rowGroups.forEach(group=>shuffle([0,1,2]).forEach(r=>rows.push(group*3+r)));
  const colGroups=shuffle([0,1,2]),cols=[];
  colGroups.forEach(group=>shuffle([0,1,2]).forEach(c=>cols.push(group*3+c)));
  const result=[];
  for(let r=0;r<9;r++){const row=[];for(let c=0;c<9;c++)row.push(nums[pattern(rows[r],cols[c])]);result.push(row)}
  return result;
}

function countSolutions(board,limit=2){
  const work=deepCopyGrid(board);
  let count=0;

  function candidates(r,c){
    const used=new Set();
    for(let x=0;x<9;x++)if(work[r][x]!==0)used.add(work[r][x]);
    for(let y=0;y<9;y++)if(work[y][c]!==0)used.add(work[y][c]);
    const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)if(work[y][x]!==0)used.add(work[y][x]);
    const result=[];for(let n=1;n<=9;n++)if(!used.has(n))result.push(n);return result;
  }

  function search(){
    if(count>=limit)return;
    let bestRow=-1,bestCol=-1,bestCandidates=null;
    for(let r=0;r<9;r++){
      for(let c=0;c<9;c++){
        if(work[r][c]!==0)continue;
        const cand=candidates(r,c);
        if(cand.length===0)return;
        if(bestCandidates===null||cand.length<bestCandidates.length){
          bestRow=r;bestCol=c;bestCandidates=cand;
          if(cand.length===1)break;
        }
      }
      if(bestCandidates&&bestCandidates.length===1)break;
    }
    if(bestCandidates===null){count++;return}
    for(const n of bestCandidates){
      work[bestRow][bestCol]=n;
      search();
      work[bestRow][bestCol]=0;
      if(count>=limit)return;
    }
  }
  search();
  return count;
}

function makePuzzle(){
  const targetRemove=difficultySettings[difficultyEl.value].remove;
  const MAX_ATTEMPTS=80;

  for(let attempt=0;attempt<MAX_ATTEMPTS;attempt++){
    const solved=makeSolution();
    const puzzleCandidate=deepCopyGrid(solved);
    let removed=0;
    const cells=shuffle(Array.from({length:81},(_,i)=>i));

    for(const index of cells){
      if(removed>=targetRemove)break;
      const r=rowOf(index),c=colOf(index),backup=puzzleCandidate[r][c];
      puzzleCandidate[r][c]=0;
      if(countSolutions(puzzleCandidate,2)===1)removed++;
      else puzzleCandidate[r][c]=backup;
    }

    if(removed>=targetRemove)return{puzzle:puzzleCandidate,solution:solved};
  }

  const solved=makeSolution(),candidate=deepCopyGrid(solved);
  let removed=0;
  for(const index of shuffle(Array.from({length:81},(_,i)=>i))){
    if(removed>=targetRemove)break;
    const r=rowOf(index),c=colOf(index),backup=candidate[r][c];
    candidate[r][c]=0;
    if(countSolutions(candidate,2)===1)removed++;
    else candidate[r][c]=backup;
  }
  return{puzzle:candidate,solution:solved};
}

function saveHistory(){
  history.push({grid:deepCopyGrid(grid),notes:notes.map(set=>new Set(set))});
  if(history.length>100)history.shift();
  future=[];
  updateUndoRedo();
}
function restoreState(state){grid=deepCopyGrid(state.grid);notes=state.notes.map(set=>new Set(set))}
function undo(){
  if(!history.length)return;
  future.push({grid:deepCopyGrid(grid),notes:notes.map(set=>new Set(set))});
  restoreState(history.pop());render();updateUndoRedo();
}
function redo(){
  if(!future.length)return;
  history.push({grid:deepCopyGrid(grid),notes:notes.map(set=>new Set(set))});
  restoreState(future.pop());render();updateUndoRedo();
}
function updateUndoRedo(){undoBtn.disabled=history.length===0;redoBtn.disabled=future.length===0}

function getRelatedIndices(index){
  const result=new Set(),r=rowOf(index),c=colOf(index);
  for(let x=0;x<9;x++)result.add(indexOf(r,x));
  for(let y=0;y<9;y++)result.add(indexOf(y,c));
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)result.add(indexOf(y,x));
  return result;
}
function getNumberCount(number){
  let count=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(grid[r][c]===number)count++;
  return count;
}

function render(){renderBoard();renderNumberPad();updateUndoRedo();memoBtn.textContent=noteMode?"メモ：ON":"メモ：OFF";memoBtn.classList.toggle("active",noteMode)}

function renderBoard(){
  boardEl.innerHTML="";
  const related=selected>=0?getRelatedIndices(selected):new Set();
  const selectedNumber=selected>=0?grid[rowOf(selected)][colOf(selected)]:0;

  for(let index=0;index<81;index++){
    const r=rowOf(index),c=colOf(index),cell=document.createElement("div");
    cell.className="cell";
    if(puzzle[r][c]!==0)cell.classList.add("given");else cell.classList.add("user-number");
    if(selected>=0&&related.has(index)&&index!==selected)cell.classList.add("related");
    if(selectedNumber!==0&&grid[r][c]===selectedNumber)cell.classList.add("same-number");
    if(index===selected)cell.classList.add("selected");
    const value=grid[r][c];
    if(value!==0&&getNumberCount(value)>=9)cell.classList.add("complete");
    if(cellIsWrong(index))cell.classList.add("hint-error");

    if(value!==0){
      const number=document.createElement("span");number.textContent=value;cell.appendChild(number);
    }else if(notes[index].size>0){renderNotes(cell,index)}

    cell.addEventListener("click",()=>{selected=index;render()});
    boardEl.appendChild(cell);
  }
}

function renderNotes(cell,index){
  const wrapper=document.createElement("div");wrapper.className="notes";
  for(let n=1;n<=9;n++){const note=document.createElement("div");note.className="note";if(notes[index].has(n))note.textContent=n;wrapper.appendChild(note)}
  cell.appendChild(wrapper);
}

function renderNumberPad(){
  numberPadEl.innerHTML="";
  for(let n=1;n<=9;n++){
    const button=document.createElement("button");button.className="num";button.textContent=n;
    if(getNumberCount(n)>=9)button.classList.add("used");
    if(selected>=0&&grid[rowOf(selected)][colOf(selected)]===n)button.classList.add("active");
    button.addEventListener("click",()=>inputNumber(n));
    numberPadEl.appendChild(button);
  }
}

function inputNumber(number){
  if(selected<0){showMessage("まず、数字を入れたいマスを選んでください。");return}
  const r=rowOf(selected),c=colOf(selected);
  if(puzzle[r][c]!==0){showMessage("この数字は最初から入っている数字です。");return}

  if(noteMode){
    if(grid[r][c]!==0){showMessage("数字を消してからメモを入れてください。");return}
    saveHistory();
    if(notes[selected].has(number))notes[selected].delete(number);else notes[selected].add(number);
    render();return;
  }

  saveHistory();
  grid[r][c]=number;
  notes[selected].clear();
  for(const index of getRelatedIndices(selected))notes[index].delete(number);
  render();
  checkCompleted();
}

function eraseSelected(){
  if(selected<0)return;
  const r=rowOf(selected),c=colOf(selected);
  if(puzzle[r][c]!==0){showMessage("最初からある数字は消せません。");return}
  if(grid[r][c]===0&&notes[selected].size===0)return;
  saveHistory();grid[r][c]=0;notes[selected].clear();render();
}

function cellIsWrong(index){
  const r=rowOf(index),c=colOf(index);
  if(grid[r][c]===0||puzzle[r][c]!==0)return false;
  return grid[r][c]!==solution[r][c];
}

function checkErrors(){
  let wrong=0,filled=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    if(grid[r][c]===0)continue;
    filled++;
    if(puzzle[r][c]===0&&grid[r][c]!==solution[r][c])wrong++;
  }
  if(wrong===0){
    if(filled===81)showMessage("すべて正解です！おめでとうございます。","success");
    else showMessage("今のところ間違っているマスはありません。","success");
  }else{
    showMessage(`間違っているマスが ${wrong} 個あります。色のついたマスを確認してください。`,"error");
  }
  render();
}

function checkCompleted(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(grid[r][c]!==solution[r][c])return;
  showMessage("完成です！すべて正解です。","success");
}
function showMessage(text,type=""){messageEl.textContent=text;messageEl.className="message";if(type)messageEl.classList.add(type)}

function newGame(){
  showMessage("新しい数独を作っています……");
  setTimeout(()=>{
    const generated=makePuzzle();
    puzzle=generated.puzzle;solution=generated.solution;grid=deepCopyGrid(puzzle);
    notes=createEmptyNotes();selected=-1;noteMode=false;history=[];future=[];
    showMessage("マスを選んで数字を入力してください。");render();
  },30);
}

memoBtn.addEventListener("click",()=>{noteMode=!noteMode;render()});
checkBtn.addEventListener("click",checkErrors);
eraseBtn.addEventListener("click",eraseSelected);
undoBtn.addEventListener("click",undo);
redoBtn.addEventListener("click",redo);
newGameBtn.addEventListener("click",newGame);
difficultyEl.addEventListener("change",newGame);

document.addEventListener("keydown",event=>{
  if(selected<0)return;
  if(event.key>="1"&&event.key<="9"){inputNumber(Number(event.key));return}
  if(event.key==="Backspace"||event.key==="Delete"||event.key==="0"){eraseSelected();return}

  const r=rowOf(selected),c=colOf(selected);let nr=r,nc=c;
  if(event.key==="ArrowUp")nr=Math.max(0,r-1);
  if(event.key==="ArrowDown")nr=Math.min(8,r+1);
  if(event.key==="ArrowLeft")nc=Math.max(0,c-1);
  if(event.key==="ArrowRight")nc=Math.min(8,c+1);
  if(nr!==r||nc!==c){selected=indexOf(nr,nc);render();event.preventDefault()}
});

newGame();
</script>
</body>
</html>
